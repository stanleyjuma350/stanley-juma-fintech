name: Build Stanley Juma Fintech APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.0'
          cache: true

      - name: Create Android platform files
        run: flutter create . --platforms=android --project-name=stanley_juma_fintech

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stanley-juma-fintech-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
