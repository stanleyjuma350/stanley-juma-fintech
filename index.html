<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stanley Juma Fintech</title><style>body{margin:0;background:#f5f7f9;font-family:Arial;color:#071b2e}.app{max-width:430px;margin:auto;min-height:100vh}.top{background:#071b2e;color:#fff;padding:28px 20px;border-radius:0 0 24px 24px}.brand{font-size:24px;font-weight:800}.balance{font-size:32px;font-weight:800;margin-top:18px}.card{background:#fff;margin:16px;border-radius:18px;padding:18px;box-shadow:0 4px 18px #00000010}.actions{display:flex;gap:8px}.actions button{flex:1;padding:12px;border:0;border-radius:12px;background:#0aae62;color:white}.stat{display:flex;justify-content:space-between}.tx{padding:12px 0;border-bottom:1px solid #eee}.green{color:#0aae62}.red{color:#d33}</style></head><body><div class="app"><div class="top"><div class="brand">STANLEY JUMA</div><small>Your Financial Partner</small><div>Wallet balance</div><div class="balance" id="bal">KSh 25,430.60</div></div><div class="card"><div class="actions"><button onclick="deposit()">Deposit</button><button onclick="loan()">Apply Loan</button><button onclick="repay()">Repay</button></div></div><div class="card"><div class="stat"><span>Loan balance</span><b>KSh 28,312</b></div><br><div class="stat"><span>Loan limit</span><b>KSh 50,000</b></div></div><div class="card"><h3>Recent transactions</h3><div class="tx">Money received <span class="green">+ KSh 5,000</span></div><div class="tx">KPLC payment <span class="red">- KSh 1,200</span></div><div class="tx">Loan repayment <span class="red">- KSh 3,500</span></div></div></div><script>let bal=25430.60;function deposit(){let x=+prompt('M-PESA deposit amount');if(x>0){bal+=x;document.getElementById('bal').textContent='KSh '+bal.toFixed(2)}}function loan(){alert('Loan application: choose amount, purpose and repayment period. Backend approval is not connected in this demo.')}function repay(){let x=+prompt('Repayment amount');if(x>0&&x<=bal){bal-=x;document.getElementById('bal').textContent='KSh '+bal.toFixed(2)}} </script></body></html>
